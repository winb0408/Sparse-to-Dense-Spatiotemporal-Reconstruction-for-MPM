# SPUR-MPM base configuration.
# Every experiment YAML is merged onto this file; --set key=value overrides last.
# A run's config.yaml in its run directory is the fully-resolved result.

experiment: SPUR-E000

data:
  index: data_local/cache/index.json          # written by scripts/prepare_data.py
  split: spur_mpm/experiments/E000_data_audit/split.json
  fold: 0
  patch_hw: [256, 256]
  # Depth context. Express it in micrometres whenever more than one plane is
  # stacked: two stacks with different z_step must be compared at equal
  # physical context, not at equal slice count (plan §3.3).
  context_slices: 1
  context_z_um: null

sampling:
  mode: y            # y | z | yz | xy | full
  ky: 2              # row spacing (Y-line skipping)
  kz: 1              # plane spacing (depth skipping)
  pattern: grid      # xy mode only: grid | rows | random
  seed: 0

physics:
  # Identity PSF on purpose: real MPM stacks already carry the true optics.
  # A non-identity PSF is a labelled degradation stress test only (plan §3.1).
  psf:
    sigma_xy_um: 0.0
    sigma_z_um: 0.0
    voxel_xy_um: 0.98
    voxel_z_um: 5.0
  # Where a non-identity `psf` above came from: calibrated_optical |
  # synthetic_extra_degradation. null is only legal while the PSF is identity;
  # a blur without a label is refused at the first batch (PR2 §2), because the
  # two sources license different conclusions.
  psf_source: null
  lam: 0.01          # Wiener regularisation
  u_kind: geo        # geo | phys | mean   (U channel source)
  geo_mode: per_axis # per_axis | physical

noise:               # extra synthetic noise; real data normally needs none
  poisson_photons: 0.0
  gaussian_sigma: 0.0
  seed: 0

selfsupervision:
  ratio: 0.5         # fraction of MEASURED positions withheld as targets
  geometry: row      # row | plane | scatter
  # false : a supervised arm is handed every measured row (headline).
  # true  : a supervised arm is handed exactly the rows a self-supervised arm
  #         would get, while keeping its dense target (E011). The control that
  #         separates "the supervised win is the extra input rows" from "the
  #         supervised win is having a dense target at all". Not to be confused
  #         with eval.input_support, which is about test time.
  split_supervised: false

model:
  arm: SS1
  base: 48
  window: 8
  depths: [2, 2, 2]
  heads: [4, 8, 16]
  # PR2 dual-prior arms only; ignored by every legacy arm.
  # phys_control destroys the physics candidate's information while keeping the
  # architecture and the parameter count (none | zeros | shuffle). It is part of
  # the config so a control run cannot look like a duplicate of the headline run
  # in its own provenance.
  phys_control: none
  # null = take the arm's own consistency mode (off for every registered arm).
  # Consistency lives inside the model, so training, evaluation and inference
  # read the same value instead of three call sites having to agree.
  consistency: null

train:
  steps: 3000
  batch: 8
  lr: 2.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 100
  accum: 1
  amp: true
  patches_per_epoch: 1000
  num_workers: 4
  val_every: 500
  log_every: 50
  ckpt_every: 500

loss:
  l1: 1.0            # supervised arms only
  ms_ssim: 0.5       # supervised arms only
  rho: charbonnier   # self-supervised MMS penalty: l1 | l2 | charbonnier
  dc_weight: 0.0     # measurement consistency; 0 = off (separate ablation)
  # dual arm only (SS1c): weight on "the two branches agree everywhere". The
  # complementary MMS terms already are mutual distillation on each other's rows;
  # this adds agreement on the rows neither branch was given.
  dual_agree: 0.0

eval:
  z_stride: 1
  # full    : score every arm with all of M_acq (headline; self-supervised arms
  #           are trained on less, so this is the deployment setting and the only
  #           fair comparison against the supervised arms).
  # holdout : keep the training-time withholding (secondary; where E_hold exists).
  input_support: full
  # false : under 'holdout' only self-supervised arms lose their holdout rows, so
  #         a parameter-free arm scored there has twice the input and is not a
  #         baseline for them.
  # true  : withhold from A0/A1 too, giving an interpolation floor on exactly the
  #         same support as the network (secondary protocols only).
  holdout_baselines: false
  # none : score the raw network output (primary results)
  # hard : replace the output with the measured value wherever the arm was given
  #        one, applied to every trained arm alike (E005 data-consistency ablation)
  consistency_projection: none

run:
  seed: 0
  device: cuda
  out_root: runs
