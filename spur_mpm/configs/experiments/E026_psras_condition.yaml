# SPUR-E026 — the historical PSRAS condition, re-run under this repository's
# observation model. Two separated groups, see
# docs/PHASE1_PR3_HISTORICAL_RECHECK.md:
#
#   matched_synthetic : Y = M * (H * D), target D, H = sigma (1.0, 1.5) pixels
#                       = (0.98, 7.5) um on this cohort. A KNOWN-kernel inverse
#                       problem; labelled as a synthetic stress test everywhere.
#   real              : Y = M * D, no extra forward blur; the inversion kernel is
#                       selected on training animals only, identity is legal.
#
# k_y = 2, k_z = 2 keeps 25 % of the voxels — the same budget as E025's
# y_k4 (1/4), which is what makes the regime comparison a comparison at all.
# Depth context is T = 2*k_z - 1 = 3; with T = 1 the skipped planes would never
# enter the network.
experiment: SPUR-E026
model:
  arm: P3_DualAdaptive
sampling:
  mode: yz
  ky: 2
  kz: 2
data:
  # The E020 Dryad cohort, named here so a direct train.py call cannot fall
  # back to the E000 audit split, which has a different fold mapping (that
  # mismatch failed with KeyError on a test animal before this line existed).
  index: data_local/dryad_cache/index_cohort.json
  split: spur_mpm/experiments/E020_cohort/split.json
  context_slices: 3
  patch_hw: [256, 256]
train:
  steps: 3000          # mechanism pilot, NOT the historical 8000-step run
  batch: 8
loss:
  l1: 1.0
  ms_ssim: 0.5
  # PR3 only; refused by train.py on any arm without auxiliary heads, so the
  # P2_ResidualI arm in the same group cannot silently acquire them.
  branch_obs_weight: 0.05
  branch_phys_weight: 0.05
physics:
  psf_source: null     # overridden per group; never left implicit
  forward_extra_psf_source: null
